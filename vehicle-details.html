                history: 'Harrier GR.7 — модернизированная версия реактивного самолёта второго поколения с вертикальным/коротким взлётом и посадкой (V/STOL) Harrier II. Самолёт создан на основе американского AV-8B Harrier II, который, в свою очередь, является развитием британского «Харриера» первого поколения.<br><br><div style="display: flex; justify-content: space-between; align-items: center; text-align: center; flex-wrap: wrap;"><div style="flex: 1; min-width: 200px; margin: 10px;"><img src="image/harriergr7history.webp" class="mapicon" alt="tornado"><p class="namemap"><strong></strong></p></div></div><h1 style="color: #ff9900; margin: 25px 0 15px 0; font-size: 45px;">Разработка:</h1><ul><li>Начало работы — в 1973 году правительства Великобритании и США подписали соглашение о совместном проекте по созданию штурмовика вертикального взлёта и посадки AV-16A «Super Harrier». Разработку планера осуществляли британская компания Hawker Siddeley и американская McDonnell Douglas, а проектирование нового двигателя — британская Rolls-Royce и американская Pratt & Whitney.</li><li>Первый прототип британской версии, известный как Harrier GR.5, совершил первый полёт в апреле 1985 года, а серийные самолёты поступили на вооружение в 1987 году.</li><li>Пока Harrier GR.5 всё ещё находился в разработке, велась работа над новым вариантом, более подходящим для ночных операций. Результатом этой разработки стал Harrier GR.7, который впервые поднялся в небо в мае 1990 года и поступил на вооружение в августе.</li></ul><h1 style="color: #ff9900; margin: 25px 0 15px 0; font-size: 45px;">Конструкчия:</h1><ul><li>новая силовая установка — турбовентиляторный двигатель Rolls-Royce Pegasus Mk.105</li><li>курсовое вооружение из пары 25-мм пушек ADEN с боезапасом 100 выстрелов на ствол</li><li>возросший вес полезной нагрузки, почти вдвое выше Harrier GR.3</li><li>возможность нести более поздние варианты ракеты класса «воздух-воздух» Sidewinder, а также ракеты класса «воздух-поверхность» AGM-65 Maverick</li><li>корректируемые авиабомбы Paveway.</li></ul><h1 style="color: #ff9900; margin: 25px 0 15px 0; font-size: 45px;">Эксплуатация:</h1><ul><li><strong>Harrier GR.7 использовался</strong> Королевскими военно-воздушными силами (RAF) и, в период с 2006 по 2010 год, Королевскими военно-морскими силами (RN).</li><li><strong>Самолёт выполнял боевые задания</strong> в Косово, Ираке и Афганистане.</li><li><strong>В декабре 2010 года</strong> бюджетные трудности привели к досрочному снятию с вооружения всех самолётов Harrier II, включая Harrier GR.7.</li></ul>',

                history: '<strong>История создания Tornado GR.1</strong> связана с идеей создания самолётов с изменяемой стреловидностью, что позволило бы сделать их манёвренными и быстрыми на большом диапазоне скоростей. Особенно заинтересованы в этом были британские военные, искавшие замену бомбардировщикам Avro Vulcan и Buccaneer. <br><br><strong>В 1960-х годах</strong> авиаконструкторы всего мира начали исследовать облик перспективного сверхзвукового истребителя-бомбардировщика, обладающего способностью к короткому взлёту и посадке. <br><br><strong>Во второй половине 1957</strong> года ВВС Великобритании выпустили тактико-технические требования GOR339, предусматривающие разработку двухместного маловысотного ударного самолёта с крылом изменяемой геометрии. <br><br><strong>К 1960 году</strong> фирма «Викерс Армстронг» проработала ряд проектов ударного самолёта с изменяемой геометрией крыла. <br><br><strong>В 1968 году</strong> Великобритания объединилась с Германией, Канадой и ещё рядом европейских стран в программе Multi Role Aircraft (MRA), но к концу года из неё вышли все, кроме Великобритании и Германии. <br><br><strong>26 марта 1969 года</strong> было образовано Panavia Aircraft GmbH. К 1970 году в проекте осталось три страны, взявшие на себя различные доли: Германия и Великобритания взяли на себя 42,5%, а Италия оставшиеся 15%. <br><br><strong>К маю было представлено</strong> два проекта: одноместный Panavia 100 и двухместный Panavia 200, который больше всего подходил британцам. Для дальнейшей разработки был выбран второй проект, первый прототип которого поднялся в небо 14 августа 1974 года. <br><br><strong>В сентябре 1974 года</strong> новому истребителю-бомбардировщику было присвоено имя Tornado. <br><br><strong>29 июля 1976 года</strong> было подписано межправительственное соглашение, по которому для трёх стран-участниц программы намечалось выпустить, в общей сложности, 640 серийных истребителей-бомбардировщиков Tornado IDS. <br><br><strong>Первый предсерийный самолёт</strong> вышел на лётные испытания 5 февраля 1977 года, а летом 1979 года начали выпускать серийные истребители-бомбардировщики. <br><br><strong>В 1980 году</strong> Британские ВВС получили первый самолёт Tornado, через год эти машины стали поступать на вооружение ВВС Италии и ФРГ. <br><br><strong>В 1984 году</strong> часть самолётов Tornado GR.1 была оборудована для доставки тактической ядерной бомбы WE177B британского производства или более мощной и «безопасной» американской бомбы В61.',

                history: '<strong>Истребитель Mitsubishi F-15J («Peace Eagle»)</strong> создан на базе McDonnell Douglas F-15 Eagle. Предназначен для завоевания превосходства в воздухе.<br><br><div style="display: flex; justify-content: space-between; align-items: center; text-align: center; flex-wrap: wrap;"><div style="flex: 1; min-width: 200px; margin: 10px;"><img src="image/f15jhistory.webp" class="mapicon" alt="tornado"><p class="namemap"><strong></strong></p></div></div><h1 style="color: #ff9900; margin: 25px 0 15px 0; font-size: 45px;">Разработка</h1><ul><li><strong>В июне–июле 1975 года</strong> Японское оборонное агентство (JDA, ныне Министерство обороны) рассматривало F-15 Eagle как одного из 13 кандидатов на замену истребителям F-104J/DJ Starfighter и F-4EJ Phantom II. В декабре 1975 года F-15 был объявлен победителем.</li><li><strong>К апрелю 1978 года</strong> Mitsubishi Heavy Industries была назначена основным подрядчиком.</li><li>Первоначально самолёты производились в США</strong> и экспортировались в Японию. Это способствовало разработке истребителя для оборонной промышленности Японии, облегчая базовое производство.</li><li><strong>Первый полёт</strong> F-15J, построенный в Сент-Луисе, состоялся 4 июня 1980 года. Кроме того, 8 F-15J были изготовлены из крупных компонентов и отправлены в Японию для окончательной сборки компанией Komaki из Mitsubishi, первый из них (серийный номер 12-8803) совершил первый полёт 26 августа 1981 года.</li></ul><br><br><h1 style="color: #ff9900; margin: 25px 0 15px 0; font-size: 45px;">Производство</h1><ul><li><strong>С 1981 года</strong> компании производили F-15J совместно по лицензии, окончательную сборку самолётов выполняла Mitsubishi. </li><li><strong>Всего было приобретено лицензия</strong> на производство 223 истребителей, из которых 20 — в двухместной учебной модификации.</li><li><strong>Первые японские самолёты</strong> были построены из машинокомплектов, переданных из США, в дальнейшем производство компонентов и комплектующих истребителя было освоено на японских предприятиях.</li><li><strong>Производство истребителей Mitsubishi F-15J осуществлялось до 1997 года.</strong> За этот период первоначальные планы были пересмотрены, и всего японцами было изготовлено 164 самолёта, из них 139 истребителей и 25 спарок.</li></ul>',
