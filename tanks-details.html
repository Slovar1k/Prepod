        .vehicle-details {
            background-color: #1a2332;

        }
        
        .vehicle-header {
            display: flex;

            gap: 30px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ff9900;
        }
        
        .vehicle-image-large {
            width: 300px;
            height: 200px;
            background: linear-gradient(135deg, #2a3a50, #3a4a60);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #8a8a8a;
            flex-shrink: 0;
        }
        
        .vehicle-title-section h1 {
            color: #ff9900;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .vehicle-subtitle {
            color: #e0e0e0;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .vehicle-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .vehicle-tag {
            background: #2a3a50;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 14px;
        }
        
        .vehicle-tag.br {
            background: #ff9900;
            color: #0a0f1e;
            font-weight: bold;
        }
        
        .info-sections {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 30px 0;
        }
        
        .info-section {
            background-color: #2a3a50;
            padding: 25px;
            border-radius: 8px;
        }
        
        .section-title {
            color: #ff9900;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 1px solid #ff9900;
            padding-bottom: 5px;
        }
        
        .specs-grid {
            display: grid;
            gap: 12px;
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a4a60;
        }
        
        .spec-name {
            color: #b0b0b0;
        }
        
        .spec-value {
            color: #ff9900;
            font-weight: bold;
            text-align: right;
        }
        
        .armament-list {
            display: grid;
            gap: 10px;
        }
        
        .armament-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a4a60;
        }
        
        .history-section {
            background-color: #2a3a50;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
        }
        
        .history-text {
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff9900;
            color: #0a0f1e;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s ease;
            border: 2px solid #ff9900;
        }
        
        .back-btn:hover {
            background-color: transparent;
            color: #ff9900;
        }
        
        @media (max-width: 768px) {
            .vehicle-header {
                flex-direction: column;
            }
            
            .vehicle-image-large {
                width: 100%;
                height: 150px;
            }
            
            .info-sections {
                grid-template-columns: 1fr;
            }
        }
    </style>

            if (vehicleId) {
                loadVehicleDetails(vehicleId);
            }
        });

            const vehicle = vehicleDatabase[vehicleId] || {
                title: vehicleId.toUpperCase().replace(/-/g, ' '),

                nation: 'США',
                type: 'Истребитель',

                era: 'VIII',
                year: '1980',

                armament: {},
                systems: {},
                history: 'Информация о данной технике находится в разработке...'
            };

            document.getElementById('page-subtitle').textContent = 'Подробные характеристики и история';

            }

            content.innerHTML = `
                <div class="vehicle-header">
                    <div class="vehicle-image-large">${vehicle.image}</div>
                    <div class="vehicle-title-section">
