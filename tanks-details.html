            gap: 30px;
            margin: 30px 0;
        }
        
        .info-section {
            background-color: #2a3a50;
            padding: 25px;
            border-radius: 8px;
        }
        
        .section-title {
            color: #ff9900;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 1px solid #ff9900;
            padding-bottom: 5px;
        }

            display: grid;
            gap: 12px;
        }
        
        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a4a60;
        }
        
        .spec-name {
            color: #b0b0b0;
        }
        
        .spec-value {
            color: #ff9900;
            font-weight: bold;
            text-align: right;
        }
        
        .armament-list {
            display: grid;
            gap: 10px;
        }
        
        .armament-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #3a4a60;
        }
        
        .history-section {
            background-color: #2a3a50;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
        }
        
        .history-text {
            line-height: 1.6;
            color: #e0e0e0;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ff9900;
            color: #0a0f1e;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s ease;
            border: 2px solid #ff9900;
        }
        
        .back-btn:hover {
            background-color: transparent;
            color: #ff9900;
        }
        
        @media (max-width: 768px) {
            .vehicle-header {
                flex-direction: column;
            }

                width: 100%;

            }

                grid-template-columns: 1fr;
            }
