<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авиация - War Thunder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/maxresdefault.png">
    <style>
        .technique-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .technique-card {
            background-color: #1a2332;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }
        
        .technique-card:hover {
            transform: translateY(-5px);
            border-color: #ff9900;
            background-color: #233044;
        }
        
        .technique-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        .technique-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #ff9900;
        }
        
        .technique-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }
        
        .technique-stat {
            text-align: center;
        }
        
        .stat-value {
            display: block;
            font-size: 16px;
            font-weight: bold;
            color: #ff9900;
        }
        
        .stat-label {
            font-size: 12px;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">WT</div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="aviation-list.html">Авиация</a></li>
                        <li><a href="tanks-list.html">Танки</a></li>
                        <li><a href="fleet-list.html">Флот</a></li>
                        <li><a href="aviation-wiki.html">Энциклопедия</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h2>НАЗЕМНАЯ ТЕХНИКА</h2>
                <p>Более 1000 танков и САУ из разных стран и эпох</p>
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <h2 class="section-title">Танки</h2>
            <div class="technique-grid">
                <div class="technique-card">
                    <div class="technique-icon"><img src="image/i (5)-no-bg-preview (carve.photos).png" class="tank_logo"></div>
                    <h3>ОБТ</h3>
                    <p>Завоевание поля боя</p>
                    <div class="technique-stats">
                        <div class="technique-stat">
                            <span class="stat-value">600+</span>
                            <span class="stat-label">Моделей</span>
                        </div>
                        <div class="technique-stat">
                            <span class="stat-value">1.0-12.7</span>
                            <span class="stat-label">БР</span>
                        </div>
                    </div>
                </div>
                <div class="technique-card">
                    <div class="technique-icon"><img src="image/bmp_1.png" class="tank_logo"></div>
                    <h3>БМП</h3>
                    <p>Поддержка ОБТ</p>
                    <div class="technique-stats">
                        <div class="technique-stat">
                            <span class="stat-value">150+</span>
                            <span class="stat-label">Моделей</span>
                        </div>
                        <div class="technique-stat">
                            <span class="stat-value">1.3-8.0</span>
                            <span class="stat-label">БР</span>
                        </div>
                    </div>
                </div>
                <div class="technique-card">
                    <div class="technique-icon"><img src="image/self-propelled-howitzer-silhouette-raised-barrel-m-no-bg-preview (carve.photos).png" class="sau"></div>
                    <h3>САУ</h3>
                    <p>Поддержка наземных войск</p>
                    <div class="technique-stats">
                        <div class="technique-stat">
                            <span class="stat-value">80+</span>
                            <span class="stat-label">Моделей</span>
                        </div>
                        <div class="technique-stat">
                            <span class="stat-value">2.0-10.0</span>
                            <span class="stat-label">БР</span>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </section>
</body>
</html>
