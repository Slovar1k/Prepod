<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеогалерея - War Thunder</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .videos-page {
            padding: 80px 0;
        }
        
        .video-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            background: #2a3a50;
            border: 2px solid #ff9900;
            color: #e0e0e0;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        
        .category-btn.active,
        .category-btn:hover {
            background: #ff9900;
            color: #0a0f1e;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .video-card {
            background: linear-gradient(rgba(26, 35, 50, 0.9), rgba(40, 50, 70, 0.9));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 153, 0, 0.3);
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.2);
        }
        
        .video-player {
            width: 100%;
            height: 200px;
            background: #1a2332;
            border-bottom: 2px solid #ff9900;
        }
        
        .video-info {
            padding: 20px;
        }
        
        .video-title {
            color: #ff9900;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .video-description {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #8a8a8a;
            font-size: 12px;
            border-top: 1px solid #2a3a50;
            padding-top: 10px;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #8a8a8a;
            font-style: italic;
        }
        
        .admin-note {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(42, 58, 80, 0.5);
            border-radius: 8px;
            color: #8a8a8a;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="image/maxresdefault.png" class="logowt">
                    <div class="logo-icon"></div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="encyclopedia.html">Энциклопедия</a></li>
                        <li><a href="videos.html" style="background-color: #ff9900; color: #0a0f1e;">Видео</a></li>
                        <li><a href="my-technique.html">Моя техника</a></li>
                        <li><a href="nations.html">Нации</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h2>ВИДЕОГАЛЕРЕЯ</h2>
                <p>Лучшие моменты и записи боев из War Thunder</p>
            </div>
        </div>
    </section>

    <section class="videos-page">
        <div class="container">
            <!-- Кнопки категорий -->
            <div class="video-categories">
                <button class="category-btn active" data-category="all">Все видео</button>
                <button class="category-btn" data-category="aviation">Авиация</button>
                <button class="category-btn" data-category="ground">Наземная техника</button>
                <button class="category-btn" data-category="fleet">Флот</button>
            </div>

            <!-- Сетка видео -->
            <div id="videoGrid" class="video-grid">
                <!-- Видео загружаются через JavaScript -->
            </div>

            <!-- Сообщение если нет видео -->
            <div id="emptyMessage" class="empty-message" style="display: none;">
                <h3>Пока нет видео в этой категории</h3>
                <p>Новые видео добавляются администратором</p>
            </div>

            <!-- Примечание для администратора -->
            
        </div>
    </section>

    <script>
        // БАЗА ДАННЫХ ВИДЕО - редактируйте здесь
        const videoDatabase = [
            // === АВИАЦИЯ ===
            {
                id: 1,
                title: 'F-16 против МиГ-29 | Эпический воздушный бой',
                url: 'https://www.youtube.com/embed/3BNnLkxvrlY',
                category: 'aviation',
                description: 'Захватывающий дуэль между американским F-16 и советским МиГ-29',
                date: '15.05.2023',
                views: '12.5K'
            },
            {
                id: 2,
                title: 'Су-27СМ в бою | Демонстрация возможностей',
                url: 'https://www.youtube.com/embed/2nQOIIIh_rI',
                category: 'aviation',
                description: 'Боевое применение российского истребителя Су-27СМ',
                date: '12.05.2023',
                views: '8.7K'
            },
            {
                id: 3,
                title: 'МиГ-29 | Взлет и боевое маневрирование',
                url: 'https://www.youtube.com/embed/4I0F2-4N4nU',
                category: 'aviation',
                description: 'Показательные выступления истребителя МиГ-29',
                date: '10.05.2023',
                views: '6.3K'
            },
            
            // === НАЗЕМНАЯ ТЕХНИКА ===
            {
                id: 4,
                title: 'Танковый бой на M1 Abrams',
                url: 'https://www.youtube.com/embed/lrI1-2Gw8P8',
                category: 'ground',
                description: 'Тактика ведения боя на американском танке M1 Abrams',
                date: '18.05.2023',
                views: '9.2K'
            },
            {
                id: 5,
                title: 'Т-90 в действии | Современный российский танк',
                url: 'https://www.youtube.com/embed/mNfndaPT-yE',
                category: 'ground',
                description: 'Боевые возможности танка Т-90',
                date: '14.05.2023',
                views: '7.8K'
            },
            {
                id: 6,
                title: 'Леопард 2 | Немецкая бронетехника',
                url: 'https://www.youtube.com/embed/KiVaUxERZ_E',
                category: 'ground',
                description: 'Обзор и боевое применение танка Leopard 2',
                date: '11.05.2023',
                views: '5.4K'
            },
            
            // === ФЛОТ ===
            {
                id: 7,
                title: 'Морской бой на эсминце',
                url: 'https://www.youtube.com/embed/hL4lSavSep4',
                category: 'fleet',
                description: 'Эпизод морского сражения на эскадренном миноносце',
                date: '20.05.2023',
                views: '4.1K'
            },
            {
                id: 8,
                title: 'Крейсерская операция | Военно-морские силы',
                url: 'https://www.youtube.com/embed/VIDEO_ID_8',
                category: 'fleet',
                description: 'Действия крейсера в открытом море',
                date: '16.05.2023',
                views: '3.2K'
            },
            {
                id: 9,
                title: 'Катерные атаки | Скоростные лодки',
                url: 'https://www.youtube.com/embed/VIDEO_ID_9',
                category: 'fleet',
                description: 'Тактика использования патрульных катеров',
                date: '13.05.2023',
                views: '2.8K'
            }
        ];

        // Функция отображения видео
        function displayVideos(category = 'all') {
            const videoGrid = document.getElementById('videoGrid');
            const emptyMessage = document.getElementById('emptyMessage');
            
            // Фильтруем видео по категории
            let filteredVideos = videoDatabase;
            if (category !== 'all') {
                filteredVideos = videoDatabase.filter(video => video.category === category);
            }
            
            // Очищаем сетку
            videoGrid.innerHTML = '';
            
            // Если нет видео - показываем сообщение
            if (filteredVideos.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }
            
            emptyMessage.style.display = 'none';
            
            // Добавляем видео
            filteredVideos.forEach(video => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.dataset.category = video.category;
                
                videoCard.innerHTML = `
                    <div class="video-player">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src="${video.url}" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-description">${video.description}</div>
                        <div class="video-meta">
                            <span>Категория: ${getCategoryName(video.category)}</span>
                            <span>${video.date} | 👁️ ${video.views}</span>
                        </div>
                    </div>
                `;
                
                videoGrid.appendChild(videoCard);
            });
        }

        // Функция получения названия категории
        function getCategoryName(category) {
            const categories = {
                'aviation': 'Авиация',
                'ground': 'Наземная техника',
                'fleet': 'Флот'
            };
            return categories[category] || category;
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Показываем все видео
            displayVideos();
            
            // Обработчики для кнопок категорий
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Убираем активный класс у всех кнопок
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    
                    // Добавляем активный класс нажатой кнопке
                    this.classList.add('active');
                    
                    // Показываем видео выбранной категории
                    const category = this.dataset.category;
                    displayVideos(category);
                });
            });
        });
    </script>
</body>
</html>
