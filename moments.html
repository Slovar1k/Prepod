<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеогалерея - War Thunder</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .videos-page {
            padding: 80px 0;
        }
        
        .video-categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            background: #2a3a50;
            border: 2px solid #ff9900;
            color: #e0e0e0;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 16px;
        }
        
        .category-btn.active,
        .category-btn:hover {
            background: #ff9900;
            color: #0a0f1e;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        
        .video-card {
            background: linear-gradient(rgba(26, 35, 50, 0.9), rgba(40, 50, 70, 0.9));
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 153, 0, 0.3);
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 153, 0, 0.2);
        }
        
        .video-player {
            width: 100%;
            height: 200px;
            background: #1a2332;
            border-bottom: 2px solid #ff9900;
        }
        
        .video-info {
            padding: 20px;
        }
        
        .video-title {
            color: #ff9900;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .video-description {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #8a8a8a;
            font-size: 12px;
            border-top: 1px solid #2a3a50;
            padding-top: 10px;
        }
        
        .add-video-section {
            background: rgba(42, 58, 80, 0.5);
            border-radius: 10px;
            padding: 30px;
            margin-top: 50px;
            border: 2px dashed #ff9900;
            text-align: center;
        }
        
        .add-video-form {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            color: #ff9900;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #1a2332;
            border: 1px solid #ff9900;
            border-radius: 5px;
            color: #e0e0e0;
            font-size: 16px;
        }
        
        .submit-btn {
            background: #ff9900;
            color: #0a0f1e;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            background: #ffcc80;
        }
        
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #8a8a8a;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="image/maxresdefault.png" class="logowt">
                    <div class="logo-icon"></div>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="encyclopedia.html">Энциклопедия</a></li>
                        <li><a href="videos.html" style="background-color: #ff9900; color: #0a0f1e;">Видео</a></li>
                        <li><a href="my-technique.html">Моя техника</a></li>
                        <li><a href="nations.html">Нации</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h2>ВИДЕОГАЛЕРЕЯ</h2>
                <p>Ваши лучшие моменты и записи боев из War Thunder</p>
            </div>
        </div>
    </section>

    <section class="videos-page">
        <div class="container">
            <!-- Кнопки категорий -->
            <div class="video-categories">
                <button class="category-btn active" data-category="all">Все видео</button>
                <button class="category-btn" data-category="aviation">Авиация</button>
                <button class="category-btn" data-category="ground">Наземная техника</button>
                <button class="category-btn" data-category="fleet">Флот</button>
                <button class="category-btn" data-category="tutorial">Гайды и обучение</button>
            </div>

            <!-- Сетка видео -->
            <div id="videoGrid" class="video-grid">
                <!-- Видео будут добавляться через JavaScript -->
            </div>

            <!-- Сообщение если нет видео -->
            <div id="emptyMessage" class="empty-message" style="display: none;">
                <h3>Пока нет видео в этой категории</h3>
                <p>Добавьте первое видео с помощью формы ниже!</p>
            </div>

            <!-- Форма добавления видео -->
            <div class="add-video-section">
                <h3 style="color: #ff9900; margin-bottom: 20px;">ДОБАВИТЬ НОВОЕ ВИДЕО</h3>
                <form id="addVideoForm" class="add-video-form">
                    <div class="form-group">
                        <label for="videoTitle">Название видео:</label>
                        <input type="text" id="videoTitle" class="form-control" placeholder="Например: Эпический бой на F-16" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoUrl">Ссылка на видео (YouTube embed):</label>
                        <input type="text" id="videoUrl" class="form-control" placeholder="https://www.youtube.com/embed/ваш_id" required>
                        <small style="color: #8a8a8a; display: block; margin-top: 5px;">
                            Используйте embed ссылку YouTube (Поделиться → Встроить)
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoCategory">Категория:</label>
                        <select id="videoCategory" class="form-control" required>
                            <option value="aviation">Авиация</option>
                            <option value="ground">Наземная техника</option>
                            <option value="fleet">Флот</option>
                            <option value="tutorial">Гайды и обучение</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="videoDescription">Описание:</label>
                        <textarea id="videoDescription" class="form-control" rows="3" placeholder="Краткое описание видео..."></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Добавить видео</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        // База данных видео
        let videoDatabase = JSON.parse(localStorage.getItem('warThunderVideos')) || [
            {
                id: 1,
                title: 'F-16 против МиГ-29',
                url: 'videos/T-90M.mp4',
                category: 'aviation',
                description: 'Эпический воздушный бой между F-16 и МиГ-29',
                date: '15.05.2023',
                views: '1.2K'
            },
            {
                id: 2,
                title: 'Танковый бой на Abrams',
                url: 'https://www.youtube.com/embed/lrI1-2Gw8P8',
                category: 'ground',
                description: 'Тактика ведения боя на M1 Abrams',
                date: '10.05.2023',
                views: '850'
            },
            {
                id: 3,
                title: 'Морской бой на эсминце',
                url: 'https://www.youtube.com/embed/KiVaUxERZ_E',
                category: 'fleet',
                description: 'Бой на эсминце в открытом море',
                date: '05.05.2023',
                views: '520'
            }
        ];

        // Функция отображения видео
        function displayVideos(category = 'all') {
            const videoGrid = document.getElementById('videoGrid');
            const emptyMessage = document.getElementById('emptyMessage');
            
            // Фильтруем видео по категории
            let filteredVideos = videoDatabase;
            if (category !== 'all') {
                filteredVideos = videoDatabase.filter(video => video.category === category);
            }
            
            // Очищаем сетку
            videoGrid.innerHTML = '';
            
            // Если нет видео - показываем сообщение
            if (filteredVideos.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }
            
            emptyMessage.style.display = 'none';
            
            // Добавляем видео
            filteredVideos.forEach(video => {
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.dataset.category = video.category;
                
                videoCard.innerHTML = `
                    <div class="video-player">
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src="${video.url}" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.title}</div>
                        <div class="video-description">${video.description}</div>
                        <div class="video-meta">
                            <span>Категория: ${getCategoryName(video.category)}</span>
                            <span>${video.date} | 👁️ ${video.views}</span>
                        </div>
                    </div>
                `;
                
                videoGrid.appendChild(videoCard);
            });
        }

        // Функция получения названия категории
        function getCategoryName(category) {
            const categories = {
                'aviation': 'Авиация',
                'ground': 'Наземная техника',
                'fleet': 'Флот',
                'tutorial': 'Гайды'
            };
            return categories[category] || category;
        }

        // Функция добавления видео
        function addVideo(event) {
            event.preventDefault();
            
            const title = document.getElementById('videoTitle').value;
            const url = document.getElementById('videoUrl').value;
            const category = document.getElementById('videoCategory').value;
            const description = document.getElementById('videoDescription').value;
            
            // Создаем новое видео
            const newVideo = {
                id: videoDatabase.length + 1,
                title: title,
                url: url,
                category: category,
                description: description || 'Без описания',
                date: new Date().toLocaleDateString('ru-RU'),
                views: '0'
            };
            
            // Добавляем в базу данных
            videoDatabase.push(newVideo);
            
            // Сохраняем в localStorage
            localStorage.setItem('warThunderVideos', JSON.stringify(videoDatabase));
            
            // Очищаем форму
            document.getElementById('addVideoForm').reset();
            
            // Обновляем отображение
            const activeCategory = document.querySelector('.category-btn.active').dataset.category;
            displayVideos(activeCategory);
            
            alert('Видео успешно добавлено!');
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Показываем все видео
            displayVideos();
            
            // Обработчики для кнопок категорий
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Убираем активный класс у всех кнопок
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    
                    // Добавляем активный класс нажатой кнопке
                    this.classList.add('active');
                    
                    // Показываем видео выбранной категории
                    const category = this.dataset.category;
                    displayVideos(category);
                });
            });
            
            // Обработчик формы добавления видео
            document.getElementById('addVideoForm').addEventListener('submit', addVideo);
        });
    </script>
</body>
</html>
